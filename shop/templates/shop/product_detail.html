<!-- shop/templates/shop/product_detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Simple Back Navigation -->
    <nav class="py-6 px-8">
        <a href="{% url 'home' %}" class="text-sm tracking-wide uppercase hover:text-gray-500">&larr; Back to Shop</a>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12 flex flex-col md:flex-row gap-16 items-center">
        <!-- Product Image -->
        <div class="w-full md:w-1/2">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full rounded-2xl shadow-lg">
        </div>

        <!-- Product Details & WhatsApp Button -->
        <div class="w-full md:w-1/2">
            <h1 class="text-4xl font-light mb-2">{{ product.name }}</h1>
            <p class="text-xl text-slate-500 mb-6">{{ product.quantity_ml }}ml</p>
            
            <p class="text-2xl font-medium mb-8">₦{{ product.price }}</p>
            
            <div class="prose text-slate-600 mb-10 leading-relaxed">
                {{ product.details|linebreaks }}
            </div>

            <!-- WhatsApp Integration Logic -->
            <!-- The URL encodes the message so it formats correctly in the WhatsApp app -->
            <a href="https://wa.me/{{ product.dealer_handle }}?text=Hi,%20I%27m%20interested%20in%20buying%20{{ product.name }}%20({{ product.quantity_ml }}ml)." 
               target="_blank"
               class="inline-block bg-slate-900 text-white px-8 py-4 rounded-full tracking-wide hover:bg-slate-800 transition-colors">
                Contact Dealer on WhatsApp
            </a>
        </div>
    </main>

</body>
</html>
