<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Linda Scentcity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <h1 class="text-xl tracking-widest font-serif text-gray-900">Linda Scentcity ADMIN</h1>
        <div class="space-x-4">
            <a href="{% url 'home' %}" class="text-sm hover:text-gray-500">View Site</a>
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <button type="submit" class="text-sm text-red-500 hover:text-red-700">Logout</button>
            </form>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-3 gap-10">
        <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
            <h2 class="text-2xl font-serif text-gray-900 mb-6">Add New Perfume</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="w-full bg-gray-900 text-white p-3 rounded-lg hover:bg-gray-800 transition mt-4">Upload Product</button>
            </form>
        </div>

        <div class="md:col-span-2">
            <h2 class="text-2xl font-serif mb-6 text-gray-900">Current Inventory</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {% for product in products %}
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4 items-center relative group">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-20 h-24 object-cover rounded">
                    <div class="flex-1">
                        <h4 class="font-medium text-gray-900 text-lg">{{ product.name }}</h4>
                        <p class="text-sm text-gray-500 mb-2">{{ product.quantity_ml }}ml | ₦{{ product.price }}</p>
                        
                        <div class="flex gap-4 mt-2">
                            <a href="{% url 'edit_product' product.id %}" class="text-sm text-[#D4AF37] hover:text-gray-900 transition-colors font-medium">
                                Edit
                            </a>
                            <form action="{% url 'delete_product' product.id %}" method="POST" class="inline" onsubmit="return confirm('Are you sure you want to delete {{ product.name }}? This cannot be undone.');">
                                {% csrf_token %}
                                <button type="submit" class="text-sm text-red-500 hover:text-red-700 transition-colors font-medium">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
