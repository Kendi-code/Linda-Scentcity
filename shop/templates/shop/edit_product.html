<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit {{ product.name }} | Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <h1 class="text-xl tracking-widest font-serif text-gray-900">Linda Scentcity</h1>
        <a href="{% url 'custom_dashboard' %}" class="text-sm hover:text-gray-500">&larr; Back to Dashboard</a>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-3xl font-serif text-gray-900 mb-2">Edit Product</h2>
            <p class="text-gray-500 mb-8">Currently editing: <span class="font-semibold">{{ product.name }}</span></p>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="flex gap-4 mt-6">
                    <button type="submit" class="flex-1 bg-gray-900 text-white p-3 rounded hover:bg-gray-800 transition">Save Changes</button>
                    <a href="{% url 'custom_dashboard' %}" class="block text-center border border-gray-300 text-gray-700 p-3 rounded hover:bg-gray-50 transition px-8">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
