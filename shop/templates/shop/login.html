<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login |Linda Scentcity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-light mb-6 text-center">Admin Access</h2>
        <form method="POST">
            {% csrf_token %}
            <label class="block text-sm text-slate-500 mb-1">Username</label>
            <input type="text" name="username" class="w-full p-3 border rounded-lg mb-4" required>
            <label class="block text-sm text-slate-500 mb-1">Password</label>
            <input type="password" name="password" class="w-full p-3 border rounded-lg mb-6" required>
            <button type="submit" class="w-full bg-slate-900 text-white p-3 rounded-lg hover:bg-slate-800 transition">Log In</button>
        </form>
        <a href="{% url 'home' %}" class="block text-center mt-6 text-sm text-slate-500 hover:text-slate-800">&larr; Back to Public Site</a>
    </div>
</body>
</html>
